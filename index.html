<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Absensi Kubah Emas</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FFD62E">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Absen">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html { background: #FFD62E; }
  body {
    margin: 0;
    background: #FFD62E;
    display: flex;
    justify-content: center;
    font-family: Poppins, 'Segoe UI', sans-serif;
    color: #141111;
  }
  .hp {
    width: 100%;
    max-width: 430px;
    min-height: 100vh;
    min-height: 100dvh;
    background: #FFD62E;
    display: flex;
    flex-direction: column;
    /* jarak aman untuk bar status / poni / garis bawah HP */
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  /* di layar lebar (laptop) tampilkan seperti bingkai HP */
  @media (min-width: 600px) {
    html, body { background: #E8E6E0; }
  }
  .layar { display: none; flex-direction: column; flex: 1; }
  .layar.aktif { display: flex; }


  /* ---- Layar utama (disalin dari mockup 01 - Layar utama) ---- */
  #layarUtama { padding: 24px 22px 26px; gap: 20px; }
  .baris-atas { display: flex; justify-content: space-between; align-items: center; }
  .baris-atas img { height: 58px; width: auto; }
  .kolom-kanan-atas { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .status-badge { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: #333438; color: #FFD62E; font-size: 12px; font-weight: 700; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #5FD38A; }
  .status-badge.offline .status-dot { background: #D92A22; }
  .label-shift { display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; border: 2px solid #333438; background: #FFFFFF; font-size: 12px; font-weight: 800; min-height: 30px; }
  .info-cabang { display: flex; gap: 12px; align-items: stretch; }
  .info-cabang .garis { width: 6px; background: #141111; }
  .info-cabang .teks { display: flex; flex-direction: column; gap: 2px; }
  .info-cabang .nama-cabang { font-size: 15px; font-weight: 700; }
  .info-cabang .tanggal { font-size: 14px; font-weight: 500; }
  .jam { font-family: Oswald, 'Arial Narrow', sans-serif; font-size: 72px; font-weight: 700; line-height: 1; letter-spacing: -1px; text-align: center; color: #141111; }
  .jam .detik { font-size: 30px; font-weight: 600; color: #3E3F42; margin-left: 4px; }
  .area-tombol { display: flex; flex-direction: column; gap: 14px; flex-grow: 1; }
  .tombol-absen { height: 112px; border: 4px solid; border-radius: 26px; color: #FFFFFF; font-family: inherit; display: flex; align-items: center; gap: 18px; padding: 0 22px; text-align: left; }
  .tombol-absen .lingkar { width: 56px; height: 56px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .tombol-absen .teks-tombol { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
  .tombol-absen .judul { font-family: Oswald, 'Arial Narrow', sans-serif; font-size: 32px; font-weight: 700; letter-spacing: 0.5px; }
  .tombol-absen .sub { font-size: 13px; font-weight: 500; }
  #btnMasuk { background: #1F8A4C; border-color: #5CC98A; }
  #btnPulang { background: #D92A22; border-color: #FF7A6E; }
  #btnLembur { height: 72px; border: none; border-radius: 20px; background: #141111; color: #FFFFFF; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 12px; margin: 0 28px; }
  #btnLembur .judul { font-family: Oswald, 'Arial Narrow', sans-serif; font-size: 24px; font-weight: 700; text-align: left; }
  #btnLembur .sub { font-size: 11px; font-weight: 600; color: #FFD62E; text-align: left; }
  .belum-aktif { opacity: 0.45; }
  .baris-admin { display: flex; justify-content: center; }
  #btnAdmin { border: 2px solid #333438; background: transparent; color: #333438; font-family: inherit; font-size: 13px; font-weight: 700; padding: 0 20px; border-radius: 999px; min-height: 44px; }

  /* ---- Layar pilih nama + PIN ---- */
  #layarPilihNama { }
  .pilih-atas { padding: 16px 18px 12px; display: flex; flex-direction: column; gap: 10px; }
  .pilih-judul { font-family: Oswald, 'Arial Narrow', sans-serif; font-size: 24px; font-weight: 700; }
  .huruf-label { font-size: 13px; font-weight: 700; }
  .huruf-daftar { display: flex; gap: 6px; flex-wrap: wrap; }
  .huruf-daftar button { min-width: 34px; min-height: 34px; border: 2px solid #333438; border-radius: 10px; background: transparent; color: #141111; font-family: inherit; font-size: 14px; font-weight: 700; }
  .huruf-daftar button.aktif { border: none; background: #333438; color: #FFD62E; font-weight: 800; }
  select#selectNama { height: 48px; border: 3px solid #333438; border-radius: 14px; background: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 700; color: #141111; padding: 0 10px; }
  #infoMuat { font-size: 13px; text-align: center; padding: 6px; }
  .kotak-pin { flex-grow: 1; background: #fff; border-radius: 28px 28px 0 0; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
  .pin-judul { font-size: 15px; font-weight: 700; text-align: center; }
  .pin-titik { display: flex; justify-content: center; gap: 16px; }
  .pin-titik div { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #9A9A9A; box-sizing: border-box; }
  .pin-titik div.isi { background: #141111; border: none; }
  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .keypad button { height: 52px; border: none; border-radius: 12px; background: #FFF4C2; font-family: Oswald, 'Arial Narrow', sans-serif; font-size: 22px; font-weight: 600; color: #141111; }
  .keypad button.kosong { background: transparent; font-family: inherit; font-size: 14px; font-weight: 700; color: #333438; }
  .keypad button:disabled { opacity: 0.4; }
  .pin-ket { font-size: 12px; color: #5A5B5E; text-align: center; }
  #btnBatalNama { background: transparent; border: none; text-align: center; font-size: 13px; font-weight: 700; color: #141111; padding: 4px; text-decoration: underline; }


  /* ---- Pop-up hasil absen (disalin dari mockup 6a tepat waktu, 6b telat, 6b2 alasan) ---- */
  @keyframes jatuh { 0% { transform: translateY(-40px) rotate(0deg); opacity: 0; } 10% { opacity: 1; } 100% { transform: translateY(110vh) rotate(540deg); opacity: 1; } }
  @keyframes sinar { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes muncul { 0% { transform: scale(.4); opacity: 0; } 70% { transform: scale(1.12); opacity: 1; } 100% { transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

  .popup { position: fixed; inset: 0; height: 100dvh; display: none; box-sizing: border-box; padding: calc(22px + env(safe-area-inset-top)) 22px calc(22px + env(safe-area-inset-bottom)); flex-direction: column; justify-content: center; align-items: center; overflow: hidden; z-index: 10; }
  .popup.tampil { display: flex; }
  .popup.hadir { background: radial-gradient(circle at 50% 30%, #3CC47A 0%, #1F8A4C 55%, #146B39 100%); }
  .popup.merah { background: #B91C1C; }
  .popup .kartu { position: relative; width: 100%; max-width: 390px; background: #FFFFFF; border-radius: 30px; padding: 30px 20px 20px; display: flex; flex-direction: column; gap: 16px; align-items: center; text-align: center; }
  .popup .ikon-besar { position: relative; width: 112px; height: 112px; display: flex; align-items: center; justify-content: center; }
  .popup .ikon-besar .bulat { position: relative; width: 112px; height: 112px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .popup .ikon-besar .sinar { position: absolute; inset: -16px; border-radius: 50%; background: repeating-conic-gradient(#F5C518 0 10deg, transparent 10deg 30deg); animation: sinar 8s linear infinite; }
  .popup.hadir .bulat { background: #1F8A4C; animation: muncul .8s ease-out both; }
  .popup.merah .bulat { background: #B91C1C; }
  .popup .judul-popup { font-family: Oswald, 'Arial Narrow', sans-serif; font-size: 40px; font-weight: 700; line-height: 1.1; }
  .popup.hadir .judul-popup { color: #1F8A4C; }
  .popup.merah .judul-popup { color: #B91C1C; }
  .popup .pil { padding: 6px 14px; border-radius: 999px; font-size: 14px; font-weight: 800; }
  .popup.hadir .pil { border: 2px solid #1F8A4C; background: #E3F4EA; color: #15643A; }
  .popup.merah .pil { border: 2px solid #B91C1C; background: #FDE8E8; color: #B91C1C; }
  .popup .petunjuk { font-size: 13px; color: #5A5B5E; }
  .popup .petunjuk-merah { font-size: 13px; font-weight: 700; color: #B91C1C; }
  .popup .tombol-alasan { width: 100%; min-height: 64px; border: none; border-radius: 22px; background: #141111; color: #FFFFFF; font-family: Oswald, 'Arial Narrow', sans-serif; font-size: 24px; font-weight: 700; }
  .confetti { position: absolute; top: 0; border-radius: 2px; animation: jatuh linear infinite; }

  /* ---- Layar alasan telat ---- */
  #layarAlasan { position: fixed; inset: 0; height: 100dvh; display: none; box-sizing: border-box; padding: calc(24px + env(safe-area-inset-top)) 22px calc(28px + env(safe-area-inset-bottom)); background: #B91C1C; color: #FFFFFF; flex-direction: column; gap: 16px; overflow-y: auto; z-index: 11; }
  #layarAlasan.tampil { display: flex; }
  .alasan-chip { align-self: flex-start; padding: 6px 12px; border-radius: 999px; border: 2px solid #FFFFFF; font-size: 13px; font-weight: 800; }
  .alasan-judul { display: flex; gap: 12px; align-items: stretch; }
  .alasan-judul .garis { width: 6px; background: #FFFFFF; }
  .alasan-judul .h { font-family: Oswald, 'Arial Narrow', sans-serif; font-size: 28px; font-weight: 700; line-height: 1.1; }
  .alasan-judul .s { font-size: 13px; font-weight: 600; }
  .alasan-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .alasan-grid button { min-height: 64px; border: none; border-radius: 16px; background: #FFFFFF; color: #141111; font-family: inherit; font-size: 15px; font-weight: 700; }
  .alasan-grid button.dipilih { background: #141111; color: #FFD62E; font-weight: 800; }
  .alasan-ket { display: flex; flex-direction: column; gap: 6px; }
  .alasan-ket label { font-size: 13px; font-weight: 700; }
  .alasan-ket textarea { height: 64px; border: 2px solid #333438; border-radius: 14px; background: #FFFFFF; font-family: inherit; font-size: 14px; color: #141111; padding: 10px; box-sizing: border-box; resize: none; }
  #pesanAlasan { min-height: 18px; font-size: 13px; font-weight: 700; text-align: center; }
  #btnSimpanAlasan { height: 70px; border: none; border-radius: 26px; background: #141111; color: #FFFFFF; font-family: Oswald, 'Arial Narrow', sans-serif; font-size: 26px; font-weight: 700; flex-shrink: 0; }
  #btnSimpanAlasan:disabled { opacity: 0.5; }
  .alasan-foot { font-size: 12px; font-weight: 600; text-align: center; }
</style>
</head>
<body>
<div class="hp">

  <div id="layarUtama" class="layar aktif">
    <div class="baris-atas">
      <img src="assets/logo.png" alt="Kubah Emas Indonesia">
      <div class="kolom-kanan-atas">
        <div class="status-badge" id="statusBadge"><div class="status-dot"></div><div id="statusTeks">Online</div></div>
        <div class="label-shift"><span id="labelShift">Shift 1 aktif</span> <svg aria-hidden="true" fill="none" height="12" stroke="#141111" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" viewBox="0 0 24 24" width="12"><path d="M6 9l6 6 6-6"></path></svg></div>
      </div>
    </div>
    <div class="info-cabang">
      <div class="garis"></div>
      <div class="teks">
        <div class="nama-cabang" id="namaCabang">Cabang</div>
        <div class="tanggal" id="tanggalHariIni">-</div>
      </div>
    </div>
    <div class="jam" id="jamBesar">--:--<span class="detik" id="jamDetik">:--</span></div>
    <div class="area-tombol">
      <button class="tombol-absen" id="btnMasuk" type="button">
        <div class="lingkar"><svg aria-hidden="true" fill="none" height="30" stroke="#1F8A4C" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewBox="0 0 24 24" width="30"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><path d="M10 17l5-5-5-5"></path><path d="M15 12H3"></path></svg></div>
        <div class="teks-tombol"><div class="judul">ABSEN MASUK</div><div class="sub" id="subMasuk">&nbsp;</div></div>
      </button>
      <button class="tombol-absen belum-aktif" id="btnPulang" type="button" disabled>
        <div class="lingkar"><svg aria-hidden="true" fill="none" height="30" stroke="#D92A22" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewBox="0 0 24 24" width="30"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="M16 17l5-5-5-5"></path><path d="M21 12H9"></path></svg></div>
        <div class="teks-tombol"><div class="judul">ABSEN PULANG</div><div class="sub" id="subPulang">&nbsp;</div></div>
      </button>
      <div style="flex-grow:1"></div>
      <button class="belum-aktif" id="btnLembur" type="button" disabled>
        <svg aria-hidden="true" fill="none" height="24" stroke="#FFD62E" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewBox="0 0 24 24" width="24"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
        <div><div class="judul">LEMBUR</div><div class="sub" id="subLembur">&nbsp;</div></div>
      </button>
    </div>
    <div class="baris-admin">
      <button class="belum-aktif" id="btnAdmin" type="button" disabled>Masuk sebagai Admin</button>
    </div>
  </div>


  <div id="layarPilihNama" class="layar">
    <div class="pilih-atas">
      <div class="pilih-judul">Pilih nama</div>
      <div class="huruf-label">Huruf depan nama</div>
      <div class="huruf-daftar" id="hurufDaftar"></div>
      <label for="selectNama" style="font-size:13px; font-weight:700">Nama (urut abjad)</label>
      <select id="selectNama">
        <option value="">-- pilih nama --</option>
      </select>
      <div id="infoMuat"></div>
    </div>
    <div class="kotak-pin">
      <div class="pin-judul">Masukkan PIN 4 digit</div>
      <div class="pin-titik" id="pinTitik">
        <div></div><div></div><div></div><div></div>
      </div>
      <div class="keypad" id="keypad">
        <button type="button" data-digit="1">1</button>
        <button type="button" data-digit="2">2</button>
        <button type="button" data-digit="3">3</button>
        <button type="button" data-digit="4">4</button>
        <button type="button" data-digit="5">5</button>
        <button type="button" data-digit="6">6</button>
        <button type="button" data-digit="7">7</button>
        <button type="button" data-digit="8">8</button>
        <button type="button" data-digit="9">9</button>
        <button type="button" class="kosong" id="btnBatalPin">Batal</button>
        <button type="button" data-digit="0">0</button>
        <button type="button" id="btnHapusDigit" aria-label="Hapus angka">⌫</button>
      </div>
      <div class="pin-ket">Digit keempat langsung mengirim absen</div>
      <button id="btnBatalNama" type="button">‹ Kembali ke layar utama</button>
    </div>
  </div>

</div>

<div id="popup" class="popup" role="alertdialog" aria-live="assertive"></div>

<div id="layarAlasan" role="dialog" aria-live="polite">
  <div class="alasan-chip" id="alasanChip"></div>
  <div class="alasan-judul"><div class="garis"></div><div><div class="h" id="alasanJudul"></div><div class="s" id="alasanSub"></div></div></div>
  <div class="alasan-grid" id="alasanGrid"></div>
  <div class="alasan-ket">
    <label for="alasanKet">Keterangan (wajib jika pilih Lainnya)</label>
    <textarea id="alasanKet" maxlength="100"></textarea>
  </div>
  <div id="pesanAlasan"></div>
  <div style="flex-grow:1"></div>
  <button id="btnSimpanAlasan" type="button">SIMPAN ALASAN</button>
  <div class="alasan-foot">Tanpa sentuhan 30 detik: TIDAK DIISI.</div>
</div>

<script src="config.js"></script>
<script>
(function () {
  const CONFIG = window.APP_CONFIG;
  const layarUtama = document.getElementById('layarUtama');
  const layarPilihNama = document.getElementById('layarPilihNama');
  const popup = document.getElementById('popup');
  const layarAlasan = document.getElementById('layarAlasan');
  const metaTema = document.querySelector('meta[name="theme-color"]');
  const TEMA = { kuning: '#FFD62E', hijau: '#1F8A4C', merah: '#B91C1C' };

  document.getElementById('namaCabang').textContent = 'Cabang ' + CONFIG.cabang + ' · ' + CONFIG.namaPerangkat;
  document.getElementById('labelShift').textContent = CONFIG.labelShift;
  document.getElementById('tanggalHariIni').textContent = new Intl.DateTimeFormat('id-ID', {
    weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
  }).format(new Date());

  // ---- Status online/offline ----
  function perbaruiStatusOnline() {
    const badge = document.getElementById('statusBadge');
    const teks = document.getElementById('statusTeks');
    if (navigator.onLine) {
      badge.classList.remove('offline');
      teks.textContent = 'Online';
    } else {
      badge.classList.add('offline');
      teks.textContent = 'Offline';
    }
  }
  window.addEventListener('online', perbaruiStatusOnline);
  window.addEventListener('offline', perbaruiStatusOnline);
  perbaruiStatusOnline();

  // ---- Jam besar mengikuti jam server ----
  let selisihJamServer = 0; // ms, ditambahkan ke Date.now() lokal
  function tampilkanJam() {
    const sekarang = new Date(Date.now() + selisihJamServer);
    const dua = function (n) { return String(n).padStart(2, '0'); };
    document.getElementById('jamBesar').innerHTML =
      dua(sekarang.getHours()) + ':' + dua(sekarang.getMinutes()) +
      '<span class="detik">:' + dua(sekarang.getSeconds()) + '</span>';
  }
  setInterval(tampilkanJam, 1000);
  tampilkanJam();

  function sinkronJamServer() {
    fetch(CONFIG.webAppUrl + '?aksi=ping')
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.status === 'ok' && data.jam_server) {
          const jamServer = new Date(data.jam_server.replace(' ', 'T'));
          selisihJamServer = jamServer.getTime() - Date.now();
        }
      })
      .catch(function () { /* biarkan pakai jam HP kalau server tidak terjangkau */ });
  }
  sinkronJamServer();

  // ---- Keterangan kecil di tombol (dari info shift server) ----
  function tambahMenit(jam, menit) {
    const p = jam.split(':');
    const total = Number(p[0]) * 60 + Number(p[1]) + menit;
    const dua = function (n) { return String(n).padStart(2, '0'); };
    return dua(Math.floor(total / 60) % 24) + ':' + dua(total % 60);
  }

  function tampilkanInfoShift(sh) {
    if (!sh) { return; }
    document.getElementById('subMasuk').textContent = sh.nama + ' mulai ' + sh.masuk;
    document.getElementById('subPulang').textContent = 'Pulang normal ' + sh.pulang;
    // "Aktif mulai" = jam pulang + toleransi pulang + 1 menit
    document.getElementById('subLembur').textContent = 'Aktif mulai ' + tambahMenit(sh.pulang, Number(sh.toleransi_pulang) + 1);
  }

  // ---- Daftar karyawan (untuk layar pilih nama) ----
  let daftarKaryawan = [];
  let mutaDaftarKaryawan = false;

  function muatDaftarKaryawan() {
    const info = document.getElementById('infoMuat');
    info.textContent = 'Memuat daftar nama...';
    mutaDaftarKaryawan = true;
    const url = CONFIG.webAppUrl + '?aksi=daftar_karyawan&cabang=' + encodeURIComponent(CONFIG.cabang);
    fetch(url)
      .then(function (r) { return r.json(); })
      .then(function (data) {
        mutaDaftarKaryawan = false;
        if (data.status === 'ok') {
          daftarKaryawan = data.data.slice().sort(function (a, b) { return a.nama.localeCompare(b.nama); });
          tampilkanInfoShift(data.shift);
          info.textContent = '';
          bangunHurufDaftar();
          isiSelectNama(daftarKaryawan);
        } else {
          info.textContent = 'Gagal memuat daftar nama: ' + (data.pesan || 'tidak dikenal');
        }
      })
      .catch(function () {
        mutaDaftarKaryawan = false;
        info.textContent = 'Gagal terhubung ke server. Ketuk "Kembali" lalu coba lagi.';
      });
  }

  function bangunHurufDaftar() {
    const kontainer = document.getElementById('hurufDaftar');
    kontainer.innerHTML = '';
    const hurufSet = {};
    daftarKaryawan.forEach(function (k) { hurufSet[k.nama.charAt(0).toUpperCase()] = true; });
    const huruf = Object.keys(hurufSet).sort();
    huruf.forEach(function (h) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = h;
      btn.addEventListener('click', function () {
        const sudahAktif = btn.classList.contains('aktif');
        kontainer.querySelectorAll('button').forEach(function (b) { b.classList.remove('aktif'); });
        if (sudahAktif) {
          isiSelectNama(daftarKaryawan);
        } else {
          btn.classList.add('aktif');
          isiSelectNama(daftarKaryawan.filter(function (k) { return k.nama.charAt(0).toUpperCase() === h; }));
        }
      });
      kontainer.appendChild(btn);
    });
  }

  function isiSelectNama(daftar) {
    const select = document.getElementById('selectNama');
    select.innerHTML = '<option value="">-- pilih nama --</option>';
    daftar.forEach(function (k) {
      const opt = document.createElement('option');
      opt.value = k.id;
      opt.textContent = k.nama;
      opt.dataset.panggilan = k.panggilan;
      select.appendChild(opt);
    });
  }

  // ---- PIN keypad ----
  let idTerpilih = '';
  let panggilanTerpilih = '';
  let pinSaatIni = '';

  document.getElementById('selectNama').addEventListener('change', function (e) {
    const opt = e.target.selectedOptions[0];
    idTerpilih = e.target.value;
    panggilanTerpilih = opt ? (opt.dataset.panggilan || '') : '';
    pinSaatIni = '';
    tampilkanPinTitik();
    perbaruiKeypad();
  });

  function tampilkanPinTitik() {
    const titik = document.querySelectorAll('#pinTitik div');
    titik.forEach(function (t, i) { t.classList.toggle('isi', i < pinSaatIni.length); });
  }

  function perbaruiKeypad() {
    const aktif = !!idTerpilih;
    document.querySelectorAll('#keypad button[data-digit]').forEach(function (b) { b.disabled = !aktif; });
  }

  document.getElementById('keypad').addEventListener('click', function (e) {
    const digit = e.target.getAttribute('data-digit');
    if (digit !== null && idTerpilih && pinSaatIni.length < 4) {
      pinSaatIni += digit;
      tampilkanPinTitik();
      if (pinSaatIni.length === 4) {
        kirimAbsenMasuk();
      }
    }
  });

  document.getElementById('btnHapusDigit').addEventListener('click', function () {
    pinSaatIni = pinSaatIni.slice(0, -1);
    tampilkanPinTitik();
  });

  document.getElementById('btnBatalPin').addEventListener('click', kembaliKeLayarUtama);
  document.getElementById('btnBatalNama').addEventListener('click', kembaliKeLayarUtama);

  // ---- Hasil absen: pop-up, layar alasan telat ----
  let wajib = false;            // true saat pop-up TELAT / layar alasan tampil (Back HP tidak boleh menutup)
  let timerPopup = null;
  let timerHitung = null;
  let timerDiamAlasan = null;
  let sedangSimpanAlasan = false;
  let alasan = null;            // { id, kode, pilihan, daftar, panggilan, telatMnt, jam, shift }

  function escHtml(t) {
    return String(t).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function setTema(warna) { metaTema.setAttribute('content', warna); }

  function tutupPopup() {
    clearTimeout(timerPopup);
    clearInterval(timerHitung);
    popup.className = 'popup';
    popup.innerHTML = '';
    popup.onclick = null;
    wajib = false;
    setTema(TEMA.kuning);
  }

  function tutupPopupDanReset() {
    tutupPopup();
    kembaliKeLayarUtama();
  }

  // Pop-up yang menutup sendiri: ketuk di mana saja atau otomatis setelah beberapa detik, tanpa tombol X.
  function bukaPopupOtomatis(kelas, tema, html, detik) {
    tutupPopup();
    popup.className = 'popup tampil ' + kelas;
    popup.innerHTML = html;
    setTema(tema);
    popup.onclick = tutupPopupDanReset;
    timerPopup = setTimeout(tutupPopupDanReset, detik * 1000);
  }

  const SVG_JEMPOL = '<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 10v11"></path><path d="M15 5.9L14 10h5.8a2 2 0 0 1 2 2.3l-1.4 7a2 2 0 0 1-2 1.7H7V10l4.3-7.6A1.9 1.9 0 0 1 15 5.9z"></path><path d="M3 10h4v11H3z"></path></svg>';
  const SVG_PERINGATAN = '<svg width="58" height="58" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg>';
  const SVG_CENTANG = '<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>';

  function htmlConfetti() {
    const warna = ['#F5C518', '#B8F0CF', '#FFE680', '#FFD62E', '#FFFFFF'];
    const lebar = [8, 10, 12];
    const tinggi = [10, 14, 18];
    let h = '';
    for (let i = 0; i < 32; i++) {
      h += '<div class="confetti" style="left:' + Math.floor(Math.random() * 95) + '%;' +
        'width:' + lebar[i % 3] + 'px;height:' + tinggi[(i * 7) % 3] + 'px;' +
        'background:' + warna[i % warna.length] + ';' +
        'animation-duration:' + (2.6 + Math.random() * 1.6).toFixed(1) + 's;' +
        'animation-delay:' + (Math.random() * 2.5).toFixed(1) + 's"></div>';
    }
    return h;
  }

  function tampilHadir(data, panggilan) {
    bukaPopupOtomatis('hadir', TEMA.hijau,
      htmlConfetti() +
      '<div class="kartu">' +
        '<div class="ikon-besar"><div class="sinar"></div><div class="bulat">' + SVG_JEMPOL + '</div></div>' +
        '<div class="judul-popup">Selamat bekerja, ' + escHtml(panggilan) + '!</div>' +
        '<div class="pil">Masuk ' + escHtml(data.jam) + ' (' + escHtml(data.shift) + ')</div>' +
        '<div class="petunjuk">Menutup otomatis dalam 4 detik</div>' +
      '</div>', 4);
  }

  function tampilGagal(pesan) {
    bukaPopupOtomatis('merah', TEMA.merah,
      '<div class="kartu">' +
        '<div class="ikon-besar"><div class="bulat">' + SVG_PERINGATAN + '</div></div>' +
        '<div class="judul-popup">Tidak tersimpan</div>' +
        '<div class="pil" style="border-radius:18px">' + escHtml(pesan || 'Terjadi kesalahan') + '</div>' +
        '<div class="petunjuk">Ketuk di mana saja atau tunggu 4 detik</div>' +
      '</div>', 4);
  }

  function tampilTelat(data, panggilan) {
    const batas = Number(data.batas_isi_detik) || 10;
    alasan = {
      id: idTerpilih, kode: data.kode_alasan, pilihan: '', daftar: data.pilihan_alasan || [],
      panggilan: panggilan, telatMnt: data.telat_mnt, jam: data.jam, shift: data.shift
    };
    tutupPopup();
    wajib = true;
    popup.className = 'popup tampil merah';
    setTema(TEMA.merah);
    popup.innerHTML =
      '<div class="kartu">' +
        '<div class="ikon-besar"><div class="bulat">' + SVG_PERINGATAN + '</div></div>' +
        '<div class="judul-popup">Telat ' + escHtml(data.telat_mnt) + ' menit, ' + escHtml(panggilan) + '!!</div>' +
        '<div class="pil">Masuk ' + escHtml(data.jam) + ' (' + escHtml(data.shift) + ')</div>' +
        '<button type="button" class="tombol-alasan" id="btnIsiAlasan">ISI ALASAN TELAT</button>' +
        '<div class="petunjuk-merah">Isi dalam <b id="sisaDetik">' + batas + '</b> detik.</div>' +
      '</div>';
    document.getElementById('btnIsiAlasan').addEventListener('click', function () {
      tutupPopup();
      bukaLayarAlasan();
    });
    const selesai = Date.now() + batas * 1000;
    timerHitung = setInterval(function () {
      const sisa = Math.ceil((selesai - Date.now()) / 1000);
      if (sisa <= 0) {
        // Tidak ditekan: alasan tetap "TIDAK DIISI" di server.
        alasan = null;
        tutupPopupDanReset();
        return;
      }
      const el = document.getElementById('sisaDetik');
      if (el) { el.textContent = sisa; }
    }, 250);
  }

  // ---- Layar alasan telat ----
  function mulaiDiamAlasan() {
    clearTimeout(timerDiamAlasan);
    timerDiamAlasan = setTimeout(function () {
      // 30 detik tanpa sentuhan: kembali ke layar utama, alasan tetap TIDAK DIISI.
      tutupLayarAlasan();
      alasan = null;
      kembaliKeLayarUtama();
    }, 30000);
  }

  ['pointerdown', 'keydown', 'input', 'touchstart', 'scroll'].forEach(function (nama) {
    layarAlasan.addEventListener(nama, function () {
      if (layarAlasan.classList.contains('tampil') && !sedangSimpanAlasan) { mulaiDiamAlasan(); }
    }, true);
  });

  function bukaLayarAlasan() {
    wajib = true;
    setTema(TEMA.merah);
    document.getElementById('alasanChip').textContent = 'Telat ' + alasan.telatMnt + ' menit';
    document.getElementById('alasanJudul').textContent = 'Kenapa telat, ' + alasan.panggilan + '? (wajib)';
    document.getElementById('alasanSub').textContent = 'Masuk ' + alasan.jam + ' (' + alasan.shift + ')';
    document.getElementById('alasanKet').value = '';
    document.getElementById('pesanAlasan').textContent = '';
    document.getElementById('btnSimpanAlasan').disabled = false;
    const grid = document.getElementById('alasanGrid');
    grid.innerHTML = '';
    alasan.daftar.forEach(function (nama) {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = nama;
      b.addEventListener('click', function () {
        alasan.pilihan = nama;
        grid.querySelectorAll('button').forEach(function (x) { x.classList.toggle('dipilih', x === b); });
      });
      grid.appendChild(b);
    });
    layarAlasan.classList.add('tampil');
    layarAlasan.scrollTop = 0;
    mulaiDiamAlasan();
  }

  function tutupLayarAlasan() {
    clearTimeout(timerDiamAlasan);
    layarAlasan.classList.remove('tampil');
    wajib = false;
    setTema(TEMA.kuning);
  }

  document.getElementById('btnSimpanAlasan').addEventListener('click', function () {
    const pesan = document.getElementById('pesanAlasan');
    const teks = document.getElementById('alasanKet').value.trim();
    if (!alasan.pilihan) { pesan.textContent = 'Pilih salah satu alasan dulu.'; return; }
    if (alasan.pilihan === 'Lainnya' && !teks) { pesan.textContent = 'Keterangan wajib diisi kalau pilih Lainnya.'; return; }
    pesan.textContent = 'Menyimpan...';
    sedangSimpanAlasan = true;
    clearTimeout(timerDiamAlasan);
    document.getElementById('btnSimpanAlasan').disabled = true;
    fetch(CONFIG.webAppUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ aksi: 'simpan_alasan', id: alasan.id, kode_alasan: alasan.kode, alasan: { pilihan: alasan.pilihan, teks: teks } })
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        sedangSimpanAlasan = false;
        tutupLayarAlasan();
        alasan = null;
        if (data.status === 'ok') {
          bukaPopupOtomatis('hadir', TEMA.hijau,
            '<div class="kartu">' +
              '<div class="ikon-besar"><div class="bulat">' + SVG_CENTANG + '</div></div>' +
              '<div class="judul-popup">Alasan tersimpan</div>' +
            '</div>', 1.8);
        } else {
          tampilGagal(data.pesan);
        }
      })
      .catch(function () {
        sedangSimpanAlasan = false;
        document.getElementById('btnSimpanAlasan').disabled = false;
        pesan.textContent = 'Tidak bisa terhubung ke server. Coba lagi.';
        mulaiDiamAlasan();
      });
  });

  function kirimAbsenMasuk() {
    perbaruiKeypadKirim(true);
    fetch(CONFIG.webAppUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ aksi: 'absen_masuk', id: idTerpilih, pin: pinSaatIni })
    })
      .then(function (r) { return r.json(); })
      .then(function (data) { tampilkanHasil(data); })
      .catch(function () { tampilkanHasil({ status: 'gagal', pesan: 'Tidak bisa terhubung ke server. Coba lagi.' }); });
  }

  function perbaruiKeypadKirim(sedangKirim) {
    document.querySelectorAll('#keypad button').forEach(function (b) { b.disabled = sedangKirim; });
  }

  function tampilkanHasil(data) {
    if (data.status !== 'ok') {
      tampilGagal(data.pesan);
      return;
    }
    const panggilan = data.panggilan || panggilanTerpilih || 'Anda';
    if (data.st_masuk === 'TELAT') { tampilTelat(data, panggilan); } else { tampilHadir(data, panggilan); }
  }

  function kembaliKeLayarUtama() {
    idTerpilih = '';
    panggilanTerpilih = '';
    pinSaatIni = '';
    tampilkanPinTitik();
    perbaruiKeypadKirim(false);
    perbaruiKeypad();
    document.getElementById('selectNama').value = '';
    document.querySelectorAll('#hurufDaftar button').forEach(function (b) { b.classList.remove('aktif'); });
    if (daftarKaryawan.length) { isiSelectNama(daftarKaryawan); }
    layarPilihNama.classList.remove('aktif');
    layarUtama.classList.add('aktif');
  }

  document.getElementById('btnMasuk').addEventListener('click', function () {
    layarUtama.classList.remove('aktif');
    layarPilihNama.classList.add('aktif');
    if (!daftarKaryawan.length && !mutaDaftarKaryawan) { muatDaftarKaryawan(); }
  });

  perbaruiKeypad();
  muatDaftarKaryawan(); // sekaligus mengisi info shift di tombol

  // Tombol Back HP: layar utama diabaikan, pop-up/layar wajib tidak bisa ditutup,
  // layar pilih nama kembali ke layar utama.
  history.pushState({ absen: 1 }, '');
  window.addEventListener('popstate', function () {
    history.pushState({ absen: 1 }, '');
    if (!wajib && layarPilihNama.classList.contains('aktif') && !popup.classList.contains('tampil')) {
      kembaliKeLayarUtama();
    }
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () { /* abaikan; halaman tetap jalan tanpa cache */ });
    });
  }
})();
</script>
</body>
</html>
