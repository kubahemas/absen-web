<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Tes API Absensi</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 480px; margin: 24px auto; padding: 0 16px; }
  h1 { font-size: 18px; }
  label { display: block; margin-top: 12px; font-weight: bold; }
  input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
  button { margin-top: 16px; margin-right: 8px; padding: 10px 16px; cursor: pointer; }
  pre { background: #f0f0f0; padding: 12px; white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>
  <h1>Tes API Absensi (bukan bagian aplikasi, cuma alat bantu tes)</h1>

  <label for="url">URL Web App</label>
  <input type="text" id="url" placeholder="https://script.google.com/macros/s/XXXX/exec">

  <label for="id">ID Karyawan</label>
  <input type="text" id="id" placeholder="K001">

  <label for="pin">PIN</label>
  <input type="password" id="pin" placeholder="1234">

  <button id="tombolPing">Tes Ping</button>
  <button id="tombolAbsen">Kirim Absen Masuk</button>

  <h3>Balasan server:</h3>
  <pre id="hasil">(belum ada)</pre>

<script>
  function ambilUrl() {
    const url = document.getElementById('url').value.trim();
    if (!url) {
      alert('Isi dulu URL Web App-nya.');
      return null;
    }
    return url;
  }

  function tampilkanHasil(teks) {
    document.getElementById('hasil').textContent = teks;
  }

  document.getElementById('tombolPing').addEventListener('click', async function () {
    const url = ambilUrl();
    if (!url) return;
    tampilkanHasil('Mengirim...');
    try {
      const res = await fetch(url + '?aksi=ping');
      tampilkanHasil(await res.text());
    } catch (err) {
      tampilkanHasil('Error: ' + err.message);
    }
  });

  document.getElementById('tombolAbsen').addEventListener('click', async function () {
    const url = ambilUrl();
    if (!url) return;
    const id = document.getElementById('id').value.trim();
    const pin = document.getElementById('pin').value.trim();
    if (!id || !pin) {
      alert('Isi dulu ID dan PIN.');
      return;
    }
    tampilkanHasil('Mengirim...');
    try {
      // Content-Type text/plain (bukan application/json) supaya browser
      // tidak melakukan CORS preflight yang tidak didukung Apps Script.
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ aksi: 'absen_masuk', id: id, pin: pin })
      });
      tampilkanHasil(await res.text());
    } catch (err) {
      tampilkanHasil('Error: ' + err.message);
    }
  });
</script>
</body>
</html>
