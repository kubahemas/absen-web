<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HP Pribadi – Login</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&amp;family=Poppins:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#141111}a:hover{color:#333438}
</style>
<style>body{background:#E8E6E0;display:flex;justify-content:center;padding:24px 0}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFD62E; font-family: Poppins, 'Segoe UI', sans-serif; color: #141111; display: flex; flex-direction: column; position: relative; overflow: hidden">
<div style="padding: 30px 24px 0; display: flex; flex-direction: column; gap: 22px; position: relative; width: 194px; height: 78px">
<img src="../assets/logo.png" alt="Kubah Emas Indonesia" style="height: 78px; width: auto; align-self: flex-start">

</div>

<div style="flex-grow: 1; position: relative"><img src="../assets/orang_transparan.png" alt="Karyawan Kubah Emas berseragam" style="position: absolute; top: 58px; height: 343px; width: 272px; opacity: 1; left: 123px"></div>
<div style="background: #FFFFFF; border-radius: 30px 30px 0 0; padding: 24px 24px 28px; display: flex; flex-direction: column; gap: 14px; position: relative">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="user" style="font-size: 13px; font-weight: 700">Username (nama lengkap)</label>
<input id="user" value="Budi Santoso" style="height: 52px; border: 2px solid #333438; border-radius: 14px; background: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 600; color: #141111; padding: 0 14px; box-sizing: border-box; width: 100%">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="pass" style="font-size: 13px; font-weight: 700">Password</label>
<input id="pass" type="password" value="rahasia12" style="height: 52px; border: 2px solid #333438; border-radius: 14px; background: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 600; color: #141111; padding: 0 14px; box-sizing: border-box; width: 100%">
</div>
<button type="button" style="height: 72px; margin-top: 4px; border: 4px solid #FF7A6E; border-radius: 999px; background: #D92A22; color: #FFFFFF; font-family: inherit; font-size: 26px; font-weight: 800">Login</button>
<div style="font-size: 12px; color: #5A5B5E; text-align: center; line-height: 1.45">Cukup login sekali. Akun terikat ke HP ini. Lupa password? Hubungi admin cabang.</div>
</div>
<div style="display: flex; gap: 12px; align-items: stretch; max-width: 180px; flex-direction: row; position: absolute; left: 25px; top: 116px">
<div style="width: 7px; background: #141111; flex-shrink: 0"></div>
<div style="font-size: 17px; font-weight: 800; line-height: 1.35; width: 312px; height: 94px">Selamat bekerja karyawan terbaik Toko Kubah Emas!</div>
</div></div>
</body>
</html>
