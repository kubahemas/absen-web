<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HP Toko – Pop-up pulang awal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&amp;family=Poppins:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
<style>body{background:#E8E6E0;display:flex;justify-content:center;padding:24px 0}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 22px; background: #141111; font-family: Poppins, 'Segoe UI', sans-serif; color: #141111; display: flex; flex-direction: column; justify-content: center; position: relative; overflow: hidden">

<div style="position: relative; background: #FFFFFF; border-radius: 30px; padding: 30px 20px 20px; display: flex; flex-direction: column; gap: 16px; align-items: center; text-align: center">
<div style="position: relative; width: 112px; height: 112px; display: flex; align-items: center; justify-content: center"><div style="position: relative; width: 112px; height: 112px; border-radius: 50%; background: #141111; display: flex; align-items: center; justify-content: center;"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#FFD62E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="M16 17l5-5-5-5"></path><path d="M21 12H9"></path></svg></div></div>
<div style="font-family: Oswald, 'Arial Narrow', sans-serif; font-size: 40px; font-weight: 700; line-height: 1.1; color: #141111">Terima kasih, Budi!</div>
<div style="padding: 6px 14px; border-radius: 999px; border: 2px solid #B91C1C; background: #FDE8E8; color: #B91C1C; font-size: 14px; font-weight: 800">Pulang awal 15:00 (Shift 1)</div>
<div style="display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; background: #141111; color: #FFD62E; font-size: 14px; font-weight: 800">Menunggu persetujuan admin</div>
<div style="font-size: 13px; font-weight: 700; color: #3E3F42; align-self: flex-start">Bulan ini</div>
<div style="width: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px"><div style="background: #F2F2F0; border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column"><div style="font-family: Oswald, 'Arial Narrow', sans-serif; font-size: 30px; font-weight: 700; line-height: 1.1; color: #141111">18</div><div style="font-size: 13px; font-weight: 600; color: #3E3F42">Masuk</div></div><div style="background: #F2F2F0; border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column"><div style="font-family: Oswald, 'Arial Narrow', sans-serif; font-size: 30px; font-weight: 700; line-height: 1.1; color: #141111">2</div><div style="font-size: 13px; font-weight: 600; color: #3E3F42">Telat</div></div><div style="background: #F2F2F0; border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column"><div style="font-family: Oswald, 'Arial Narrow', sans-serif; font-size: 30px; font-weight: 700; line-height: 1.1; color: #141111">0</div><div style="font-size: 13px; font-weight: 600; color: #3E3F42">Izin / cuti</div></div><div style="background: #F2F2F0; border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column"><div style="font-family: Oswald, 'Arial Narrow', sans-serif; font-size: 30px; font-weight: 700; line-height: 1.1; color: #141111">5 <span style="font-size: 16px">/ 6</span></div><div style="font-size: 13px; font-weight: 600; color: #3E3F42">Sisa cuti</div></div></div>

<button type="button" style="width: 100%; min-height: 64px; border: none; border-radius: 22px; background: #141111; color: #FFFFFF; font-family: Oswald, 'Arial Narrow', sans-serif; font-size: 22px; font-weight: 700">ISI ALASAN PULANG AWAL</button><div style="font-size: 13px; font-weight: 700; color: #B91C1C">Tekan dalam <b>10 detik</b>. Jika tidak, alasan tercatat TIDAK DIISI dan dilaporkan ke admin.</div>
</div>
</div>
</body>
</html>
