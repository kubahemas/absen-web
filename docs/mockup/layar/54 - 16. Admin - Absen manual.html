<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">

<title>Admin – Absen Manual</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&amp;family=Poppins:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<style>
body{margin:0}
a{color:#141111}
</style>

<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px 18px 16px; background: #FFD62E; font-family: Poppins, 'Segoe UI', sans-serif; color: #141111; display: flex; flex-direction: column; gap: 10px"><div style="display: flex; justify-content: space-between; align-items: center"><img alt="Kubah Emas Indonesia" src="../assets/logo.png" style="height: 30px; width: auto"/><div style="padding: 6px 12px; border-radius: 999px; background: #333438; color: #FFD62E; font-size: 12px; font-weight: 800">Admin Ngawi</div></div>
<div style="display: flex; gap: 12px; align-items: stretch"><div style="width: 6px; background: #141111"></div><div style="display: flex; flex-direction: column; gap: 2px"><div style="font-family: Oswald, 'Arial Narrow', sans-serif; font-size: 22px; font-weight: 700; line-height: 1.1">Absen manual</div><div style="font-size: 13px; font-weight: 600">Melengkapi absen yang terlewat</div></div></div><div style="background: #FFFFFF; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 14px"><div style="display: flex; flex-direction: column; gap: 6px"><label for="k" style="font-size: 13px; font-weight: 700">Karyawan</label><select id="k" style="height: 42px; border: 2px solid #333438; border-radius: 14px; background: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 700; color: #141111; padding: 0 12px; box-sizing: border-box; width: 100%"><option>Andi Pratama</option></select></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px"><div style="display: flex; flex-direction: column; gap: 6px"><label for="t" style="font-size: 13px; font-weight: 700">Tanggal</label><input id="t" style="height: 42px; border: 2px solid #333438; border-radius: 14px; background: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 700; color: #141111; padding: 0 12px; box-sizing: border-box; width: 100%" value="Sab, 26 Sep 2026"/></div><div style="display: flex; flex-direction: column; gap: 6px"><label for="j" style="font-size: 13px; font-weight: 700">Jam</label><input id="j" style="height: 42px; border: 2px solid #333438; border-radius: 14px; background: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 700; color: #141111; padding: 0 12px; box-sizing: border-box; width: 100%" value="16:30"/></div></div>
<div style="display: flex; flex-direction: column; gap: 6px"><div style="font-size: 13px; font-weight: 700">Jenis</div><div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px"><button style="min-height: 40px; border: 2px solid #333438; border-radius: 14px; background: #FFFFFF; color: #141111; font-family: inherit; font-size: 15px; font-weight: 700" type="button">Masuk</button><button style="min-height: 40px; border: none; border-radius: 14px; background: #141111; color: #FFD62E; font-family: inherit; font-size: 15px; font-weight: 800" type="button">Pulang</button></div></div>
<div style="display: flex; flex-direction: column; gap: 6px"><div style="font-size: 13px; font-weight: 700">Alasan</div><div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px"><button style="min-height: 40px; border: none; border-radius: 14px; background: #141111; color: #FFD62E; font-family: inherit; font-size: 13px; font-weight: 800" type="button">Lupa absen</button><button style="min-height: 40px; border: 2px solid #333438; border-radius: 14px; background: #FFFFFF; color: #141111; font-family: inherit; font-size: 13px; font-weight: 700" type="button">HP toko bermasalah</button><button style="min-height: 40px; border: 2px solid #333438; border-radius: 14px; background: #FFFFFF; color: #141111; font-family: inherit; font-size: 13px; font-weight: 700" type="button">Internet / listrik mati</button><button style="min-height: 40px; border: 2px solid #333438; border-radius: 14px; background: #FFFFFF; color: #141111; font-family: inherit; font-size: 13px; font-weight: 700" type="button">Lainnya</button></div></div>
<div style="background: #F2EFE6; border-radius: 14px; padding: 12px; font-size: 13px; font-weight: 700">Status: PULANG NORMAL (Shift 1)</div></div><div style="background: #FFFFFF; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 12px"><div style="display: flex; gap: 14px; align-items: center"><button aria-label="Buka kamera untuk foto karyawan" style="width: 60px; height: 60px; border-radius: 50%; background: #141111; border: 4px dashed #FFD62E; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #FFD62E; font-family: inherit; font-size: 11px; font-weight: 800" type="button"><svg aria-hidden="true" fill="none" height="28" stroke="#FFD62E" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="28"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>Ketuk</button><div style="display: flex; flex-direction: column; gap: 4px"><div style="font-size: 15px; font-weight: 800">Foto Andi Pratama</div><div style="font-size: 13px; font-weight: 700; color: #15643A">Ketuk kotak kamera untuk memotret</div><div style="font-size: 12px; color: #5A5B5E">Wajah harus cocok dengan nama</div></div></div></div><div style="flex-grow: 1"></div><div style="display: flex; gap: 10px; flex-shrink: 0"><button aria-label="Kembali" style="width: 56px; flex-shrink: 0; border: 3px solid #141111; border-radius: 18px; background: transparent; font-family: inherit; font-size: 26px; font-weight: 800; color: #141111" type="button">‹</button><button style="flex-grow: 1; height: 54px; border: 4px solid #5CC98A; border-radius: 26px; background: #1F8A4C; color: #FFFFFF; font-family: Oswald, 'Arial Narrow', sans-serif; font-size: 22px; font-weight: 700" type="button">SIMPAN</button></div></div>
</body>
