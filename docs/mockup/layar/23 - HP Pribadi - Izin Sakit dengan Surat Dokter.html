<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HP Pribadi – Izin Sakit dengan Surat Dokter</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&amp;family=Poppins:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
</style>
<style>body{background:#E8E6E0;display:flex;justify-content:center;padding:24px 0}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px 18px; background: #FFD62E; font-family: Poppins, 'Segoe UI', sans-serif; color: #141111; display: flex; flex-direction: column; gap: 12px">
<div style="flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-bottom: 4px"><img src="../assets/logo.png" alt="Kubah Emas Indonesia" style="height: 36px; width: auto; align-self: flex-start"><div style="display: flex; gap: 12px; align-items: stretch"><div style="width: 6px; background: #141111"></div><div style="font-family: Oswald, 'Arial Narrow', sans-serif; font-size: 28px; font-weight: 700; line-height: 1.1">Ajukan izin / cuti</div></div><div style="background: #FFFFFF; border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 10px"><div style="display: flex; flex-direction: column; gap: 4px"><div style="font-size: 12px; font-weight: 800">Jenis izin</div><select aria-label="Jenis izin" style="height: 46px; border: 2px solid #333438; border-radius: 12px; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; color: #141111; padding: 0 10px; box-sizing: border-box; width: 100%"><option>Sakit</option></select></div><div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px"><div style="display: flex; flex-direction: column; gap: 4px"><div style="font-size: 12px; font-weight: 800">Mulai</div><input aria-label="Mulai" value="Sen, 5 Okt 2026" style="height: 46px; border: 2px solid #333438; border-radius: 12px; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; color: #141111; padding: 0 10px; box-sizing: border-box; width: 100%"></div><div style="display: flex; flex-direction: column; gap: 4px"><div style="font-size: 12px; font-weight: 800">Selesai</div><input aria-label="Selesai" value="Sel, 6 Okt 2026" style="height: 46px; border: 2px solid #333438; border-radius: 12px; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; color: #141111; padding: 0 10px; box-sizing: border-box; width: 100%"></div></div><div style="font-size: 13px; font-weight: 700">2 hari kerja</div><div style="font-size: 12px; font-weight: 800">Surat dokter</div><div style="display: flex; gap: 12px; align-items: center"><div style="width: 92px; height: 120px; border-radius: 12px; background: #F2EFE6; border: 2px solid #1F8A4C; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #5A5B5E; text-align: center; flex-shrink: 0">[Foto surat]</div><div style="display: flex; flex-direction: column; gap: 8px"><div style="font-size: 13px; font-weight: 800; color: #15643A">✓ Surat terpasang</div><button type="button" style="min-height: 40px; border: 2px solid #141111; border-radius: 12px; background: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 800; color: #141111; padding: 0 12px">Ganti foto</button><div style="font-size: 12px; font-weight: 600; color: #5A5B5E">Kamera atau galeri</div></div></div><div style="background: #E3F4EA; border-radius: 12px; padding: 10px 12px; font-size: 13px; font-weight: 800; color: #15643A">Izin khusus. Tidak memengaruhi performa.</div></div><div style="flex-grow: 1"></div></div>
<div style="display: flex; gap: 10px; flex-shrink: 0"><button type="button" aria-label="Kembali" style="width: 56px; flex-shrink: 0; border: 3px solid #141111; border-radius: 18px; background: transparent; font-family: inherit; font-size: 26px; font-weight: 800; color: #141111">‹</button><button type="button" style="flex-grow: 1; height: 54px; border: 4px solid #5CC98A; border-radius: 18px; background: #1F8A4C; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 800">Kirim</button></div></div>
</body>
</html>
