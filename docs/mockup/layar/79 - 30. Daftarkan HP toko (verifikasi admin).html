<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daftarkan HP Toko (verifikasi admin)</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&amp;family=Poppins:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<style>
body{margin:0}
</style>
<style>body{background:#E8E6E0;display:flex;justify-content:center;padding:24px 0}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px 18px 16px; background: #FFD62E; font-family: Poppins, 'Segoe UI', sans-serif; color: #141111; display: flex; flex-direction: column; gap: 10px"><div style="display: flex; gap: 12px; align-items: stretch"><div style="width: 6px; background: #141111"></div><div style="display: flex; flex-direction: column; gap: 2px"><div style="font-family: Oswald, 'Arial Narrow', sans-serif; font-size: 22px; font-weight: 700; line-height: 1.1">Daftarkan HP toko</div><div style="font-size: 13px; font-weight: 600">Langkah 1: verifikasi admin · Langkah 2: konfirmasi</div></div></div><div style="background: #FFFFFF; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 12px"><div style="font-size: 14px; font-weight: 800">1. Verifikasi admin cabang</div><div style="display: flex; flex-direction: column; gap: 6px"><label for="u" style="font-size: 13px; font-weight: 700">Username (nama lengkap)</label><input autocomplete="off" id="u" placeholder="Nama lengkap admin" style="height: 42px; border: 2px solid #333438; border-radius: 14px; background: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 700; color: #141111; padding: 0 12px; box-sizing: border-box; width: 100%" value=""/></div><div style="display: flex; flex-direction: column; gap: 6px"><label for="p" style="font-size: 13px; font-weight: 700">Password</label><input autocomplete="new-password" id="p" placeholder="••••••" style="height: 42px; border: 2px solid #333438; border-radius: 14px; background: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 700; color: #141111; padding: 0 12px; box-sizing: border-box; width: 100%" type="password" value=""/></div><div style="font-size: 13px; font-weight: 700; color: #15643A">Hanya verifikasi, tidak login.</div></div><div style="background: #FFFFFF; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 10px"><div style="font-size: 14px; font-weight: 800">2. Data HP ini</div><div style="display: flex; justify-content: space-between; font-size: 14px"><span style="color: #5A5B5E; font-weight: 600">Cabang</span><span style="font-weight: 800">Ngawi (ikut cabang admin)</span></div><div style="display: flex; justify-content: space-between; font-size: 14px"><span style="color: #5A5B5E; font-weight: 600">ID HP</span><span style="font-weight: 800">HPT-NGW-03</span></div><div style="display: flex; justify-content: space-between; font-size: 14px"><span style="color: #5A5B5E; font-weight: 600">Kode di absen</span><span style="font-weight: 800">T3</span></div><div style="display: flex; flex-direction: column; gap: 6px"><label for="n" style="font-size: 13px; font-weight: 700">Nama HP (bebas, supaya mudah dikenali)</label><input id="n" style="height: 42px; border: 2px solid #333438; border-radius: 14px; background: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 700; color: #141111; padding: 0 12px; box-sizing: border-box; width: 100%" value="HP meja kasir"/></div><div style="background: #F2EFE6; border-radius: 12px; padding: 10px 12px; font-size: 12px; font-weight: 700">Lokasi HP ikut dicatat.</div></div><div style="flex-grow: 1"></div><div style="display: flex; gap: 10px; flex-shrink: 0"><button aria-label="Kembali" style="width: 56px; flex-shrink: 0; border: 3px solid #141111; border-radius: 18px; background: transparent; font-family: inherit; font-size: 26px; font-weight: 800; color: #141111" type="button">‹</button><button style="flex-grow: 1; height: 54px; border: 4px solid #5CC98A; border-radius: 26px; background: #1F8A4C; color: #FFFFFF; font-family: inherit; font-size: 18px; font-weight: 800" type="button">Daftarkan</button></div></div>
</body>
</html>
