<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin – Tukar Shift</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&amp;family=Poppins:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
</style>
<style>body{background:#E8E6E0;display:flex;justify-content:center;padding:24px 0}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: rgba(20,17,17,.5); font-family: Poppins, 'Segoe UI', sans-serif; color: #141111; display: flex; flex-direction: column; justify-content: flex-end">
<div style="background: #FFFFFF; border-radius: 28px 28px 0 0; padding: 12px 18px 16px; display: flex; flex-direction: column; gap: 12px">
<div style="align-self: center; width: 44px; height: 5px; border-radius: 999px; background: #D5D0C4"></div>
<div style="font-family: Oswald, 'Arial Narrow', sans-serif; font-size: 26px; font-weight: 700">Tukar shift</div>
<div style="font-size: 13px; font-weight: 800">Tanggal</div><input aria-label="Tanggal tukar" value="Selasa, 6 Okt 2026" style="height: 46px; border: 2px solid #333438; border-radius: 12px; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; color: #141111; padding: 0 10px; box-sizing: border-box; width: 100%">
<div style="font-size: 13px; font-weight: 800">Karyawan 1</div><select aria-label="Karyawan 1" style="height: 46px; border: 2px solid #333438; border-radius: 12px; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; color: #141111; padding: 0 10px; box-sizing: border-box; width: 100%"><option>Dina (Shift 2)</option></select>
<div style="align-self: center; width: 40px; height: 40px; border-radius: 50%; background: #141111; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFD62E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16"></path><path d="M3 8l4-4 4 4"></path><path d="M17 20V4"></path><path d="M21 16l-4 4-4-4"></path></svg></div>
<div style="font-size: 13px; font-weight: 800">Karyawan 2</div><select aria-label="Karyawan 2" style="height: 46px; border: 2px solid #333438; border-radius: 12px; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; color: #141111; padding: 0 10px; box-sizing: border-box; width: 100%"><option>Ari (Shift 1)</option></select>
<div style="background: #E3F4EA; border-radius: 14px; padding: 12px; font-size: 14px; font-weight: 700; line-height: 1.5">6 Okt: Dina → <b>Shift 1</b>, Ari → <b>Shift 2</b><br><span style="font-size: 12px; font-weight: 600; color: #3E3F42">Besok kembali ke pola masing-masing.</span></div>
<div style="display: flex; gap: 10px"><button type="button" style="width: 110px; height: 54px; border: 3px solid #141111; border-radius: 18px; background: transparent; font-family: inherit; font-size: 16px; font-weight: 800; color: #141111">Batal</button><button type="button" style="flex-grow: 1; height: 54px; border: 4px solid #5CC98A; border-radius: 18px; background: #1F8A4C; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 800">Tukar</button></div>
</div></div>
</body>
</html>
