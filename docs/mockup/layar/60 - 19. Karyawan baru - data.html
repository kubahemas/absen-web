<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px 18px 16px; background: #FFD62E; font-family: Poppins, 'Segoe UI', sans-serif; color: #141111; display: flex; flex-direction: column; gap: 10px"><div style="display: flex; justify-content: space-between; align-items: center"><img src="../assets/logo.png" alt="Kubah Emas Indonesia" style="height: 30px; width: auto"><div style="padding: 6px 12px; border-radius: 999px; background: #333438; color: #FFD62E; font-size: 12px; font-weight: 800">Admin Ngawi</div></div>
<div style="display: flex; gap: 12px; align-items: stretch"><div style="width: 6px; background: #141111"></div><div style="display: flex; flex-direction: column; gap: 2px"><div style="font-family: Oswald, 'Arial Narrow', sans-serif; font-size: 22px; font-weight: 700; line-height: 1.1">Karyawan baru</div><div style="font-size: 13px; font-weight: 600">Isi oleh admin</div></div></div><div style="display: flex; gap: 6px"><div style="flex: 1; height: 8px; border-radius: 999px; background: #141111"></div><div style="flex: 1; height: 8px; border-radius: 999px; background: #FFF4C2"></div><div style="flex: 1; height: 8px; border-radius: 999px; background: #FFF4C2"></div><div style="flex: 1; height: 8px; border-radius: 999px; background: #FFF4C2"></div></div><div style="font-size: 12px; font-weight: 700">Langkah 1 dari 4</div><div style="background: #FFFFFF; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 14px"><div style="display: flex; flex-direction: column; gap: 6px"><label for="nm" style="font-size: 13px; font-weight: 700">Nama lengkap (sekaligus username)</label><input id="nm" value="Wulan Sari" style="height: 42px; border: 2px solid #333438; border-radius: 14px; background: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 700; color: #141111; padding: 0 12px; box-sizing: border-box; width: 100%"></div><div style="display: flex; flex-direction: column; gap: 6px"><label for="np" style="font-size: 13px; font-weight: 700">Nama panggilan (tampil di pop-up)</label><input id="np" value="Wulan" style="height: 42px; border: 2px solid #333438; border-radius: 14px; background: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 700; color: #141111; padding: 0 12px; box-sizing: border-box; width: 100%"><div style="font-size: 12px; font-weight: 600; color: #15643A">Nama tersedia.</div></div><div style="display: flex; flex-direction: column; gap: 6px"><label for="sb" style="font-size: 13px; font-weight: 700">Shift (pola diatur setelah tersimpan)</label><select id="sb" style="height: 42px; border: 2px solid #333438; border-radius: 14px; background: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 700; color: #141111; padding: 0 12px; box-sizing: border-box; width: 100%"><option>Shift 1 (07:45 – 16:30)</option></select></div><div style="display: flex; flex-direction: column; gap: 6px"><label for="tm" style="font-size: 13px; font-weight: 700">Tanggal mulai kerja</label><input id="tm" value="Kamis, 1 Okt 2026" style="height: 42px; border: 2px solid #333438; border-radius: 14px; background: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 700; color: #141111; padding: 0 12px; box-sizing: border-box; width: 100%"></div><div style="background: #F2EFE6; border-radius: 14px; padding: 12px; font-size: 13px; font-weight: 700">ID otomatis: K005 · Cabang: Ngawi · Jatah cuti: 6 hari · Role: Karyawan<div style="font-size: 12px; font-weight: 600; color: #5A5B5E; margin-top: 4px">Role Admin hanya bisa diberikan owner.</div></div></div><div style="display: flex; gap: 10px; flex-shrink: 0"><button type="button" aria-label="Kembali" style="width: 56px; flex-shrink: 0; border: 3px solid #141111; border-radius: 18px; background: transparent; font-family: inherit; font-size: 26px; font-weight: 800; color: #141111">‹</button><button type="button" style="flex-grow: 1; height: 72px; border: 4px solid #5CC98A; border-radius: 26px; background: #1F8A4C; color: #FFFFFF; font-family: inherit; font-size: 18px; font-weight: 800; width: 293px">Lanjut: serahkan HP ke karyawan</button></div><button type="button" style="min-height: 44px; border: none; background: transparent; font-family: inherit; font-size: 14px; font-weight: 700; color: #B91C1C; text-decoration: underline">Batal pendaftaran (data belum disimpan)</button></div>
