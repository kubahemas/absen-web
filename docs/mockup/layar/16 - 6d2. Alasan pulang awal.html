<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HP Toko – Alasan Pulang Awal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&amp;family=Poppins:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
</style>
<style>body{background:#E8E6E0;display:flex;justify-content:center;padding:24px 0}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 24px 22px 28px; background: #B91C1C; font-family: Poppins, 'Segoe UI', sans-serif; color: #FFFFFF; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; justify-content: flex-start; align-items: center"><div style="padding: 6px 12px; border-radius: 999px; border: 2px solid #FFFFFF; background: transparent; color: #FFFFFF; font-size: 13px; font-weight: 800">Pulang awal 15:00</div></div>
<div style="display: flex; gap: 12px; align-items: stretch"><div style="width: 6px; background: #FFFFFF"></div><div style="display: flex; flex-direction: column; gap: 2px"><div style="font-family: Oswald, 'Arial Narrow', sans-serif; font-size: 28px; font-weight: 700; line-height: 1.1">Kenapa pulang awal, Budi? (wajib)</div><div style="font-size: 13px; font-weight: 600">Pulang 15:00 (Shift 1)</div></div></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px"><button type="button" style="min-height: 64px; border: none; border-radius: 16px; background: #FFFFFF; color: #141111; font-family: inherit; font-size: 15px; font-weight: 700">Sakit</button><button type="button" style="min-height: 64px; border: none; border-radius: 16px; background: #141111; color: #FFD62E; font-family: inherit; font-size: 15px; font-weight: 800">Urusan keluarga</button><button type="button" style="min-height: 64px; border: none; border-radius: 16px; background: #FFFFFF; color: #141111; font-family: inherit; font-size: 15px; font-weight: 700">Disuruh atasan</button><button type="button" style="min-height: 64px; border: none; border-radius: 16px; background: #FFFFFF; color: #141111; font-family: inherit; font-size: 15px; font-weight: 700">Lainnya</button></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="ket" style="font-size: 13px; font-weight: 700; color: #FFFFFF">Keterangan (wajib jika pilih Lainnya)</label><textarea id="ket" style="height: 64px; border: 2px solid #333438; border-radius: 14px; background: #FFFFFF; font-family: inherit; font-size: 14px; color: #141111; padding: 10px; box-sizing: border-box; resize: none">Jemput anak sakit di sekolah</textarea></div>
<div style="flex-grow: 1"></div>
<button type="button" style="height: 70px; border: none; border-radius: 26px; background: #141111; color: #FFFFFF; font-family: Oswald, 'Arial Narrow', sans-serif; font-size: 26px; font-weight: 700">SIMPAN ALASAN</button>
<div style="font-size: 12px; font-weight: 600; text-align: center">Menunggu ACC admin.</div>
</div>
</body>
</html>
