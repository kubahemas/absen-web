<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HP Toko – Pilih Nama dan PIN</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&amp;family=Poppins:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}

@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
<style>body{background:#E8E6E0;display:flex;justify-content:center;padding:24px 0}</style>
</head>
<body>
<div style="width: 390px; height: 900px; box-sizing: border-box; background: #FFD62E; font-family: Poppins, 'Segoe UI', sans-serif; color: #141111; display: flex; flex-direction: column">
<div style="padding: 22px 22px 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; gap: 14px; align-items: center">
<div style="width: 104px; height: 104px; border-radius: 50%; background: #F2EFE6; border: 5px solid #333438; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: #5A5B5E; text-align: center">[Foto kamera]</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="font-family: Oswald, 'Arial Narrow', sans-serif; font-size: 26px; font-weight: 700; line-height: 1.1">Pilih nama + PIN</div>
<div style="font-size: 13px; font-weight: 600">Foto ini tersimpan sebagai bukti absen</div>
</div>
</div>
<div style="font-size: 13px; font-weight: 700">Huruf depan nama</div>
<div style="display: flex; gap: 6px; flex-wrap: wrap"><button type="button" style="min-width: 40px; min-height: 40px; border: 2px solid #333438; border-radius: 12px; background: transparent; color: #141111; font-family: inherit; font-size: 15px; font-weight: 700">A</button><button type="button" style="min-width: 40px; min-height: 40px; border: 2px solid #333438; border-radius: 12px; background: transparent; color: #141111; font-family: inherit; font-size: 15px; font-weight: 700">B</button><button type="button" style="min-width: 40px; min-height: 40px; border: none; border-radius: 12px; background: #333438; color: #FFD62E; font-family: inherit; font-size: 15px; font-weight: 800">D</button><button type="button" style="min-width: 40px; min-height: 40px; border: 2px solid #333438; border-radius: 12px; background: transparent; color: #141111; font-family: inherit; font-size: 15px; font-weight: 700">J</button><button type="button" style="min-width: 40px; min-height: 40px; border: 2px solid #333438; border-radius: 12px; background: transparent; color: #141111; font-family: inherit; font-size: 15px; font-weight: 700">R</button><button type="button" style="min-width: 40px; min-height: 40px; border: 2px solid #333438; border-radius: 12px; background: transparent; color: #141111; font-family: inherit; font-size: 15px; font-weight: 700">S</button></div>
<label for="nama" style="font-size: 13px; font-weight: 700">Nama (terjadwal hari ini, urut abjad)</label>
<select id="nama" style="height: 54px; border: 3px solid #333438; border-radius: 14px; background: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 800; color: #141111; padding: 0 12px">
<option>Dewi Lestari (Shift 1)</option>
<option>Dimas Saputra (Shift 2)</option>
</select>
<a href="#" style="font-size: 13px; font-weight: 700; color: #141111; text-align: center; padding: 4px">Tidak ada di jadwal atau karyawan cabang lain</a>
</div>
<div style="flex-grow: 1; background: #FFFFFF; border-radius: 30px 30px 0 0; padding: 18px 22px 24px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
<div style="font-size: 15px; font-weight: 700">Masukkan PIN 4 digit</div>
<div style="display: flex; gap: 18px">
<div style="width: 18px; height: 18px; border-radius: 50%; background: #141111"></div>
<div style="width: 18px; height: 18px; border-radius: 50%; background: #141111"></div>
<div style="width: 18px; height: 18px; border-radius: 50%; border: 2px solid #9A9A9A; box-sizing: border-box"></div>
<div style="width: 18px; height: 18px; border-radius: 50%; border: 2px solid #9A9A9A; box-sizing: border-box"></div>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<button type="button" style="height: 50px; border: none; border-radius: 14px; background: #FFF4C2; font-family: Oswald, 'Arial Narrow', sans-serif; font-size: 24px; font-weight: 600; color: #141111">1</button><button type="button" style="height: 50px; border: none; border-radius: 14px; background: #FFF4C2; font-family: Oswald, 'Arial Narrow', sans-serif; font-size: 24px; font-weight: 600; color: #141111">2</button><button type="button" style="height: 50px; border: none; border-radius: 14px; background: #FFF4C2; font-family: Oswald, 'Arial Narrow', sans-serif; font-size: 24px; font-weight: 600; color: #141111">3</button><button type="button" style="height: 50px; border: none; border-radius: 14px; background: #FFF4C2; font-family: Oswald, 'Arial Narrow', sans-serif; font-size: 24px; font-weight: 600; color: #141111">4</button><button type="button" style="height: 50px; border: none; border-radius: 14px; background: #FFF4C2; font-family: Oswald, 'Arial Narrow', sans-serif; font-size: 24px; font-weight: 600; color: #141111">5</button><button type="button" style="height: 50px; border: none; border-radius: 14px; background: #FFF4C2; font-family: Oswald, 'Arial Narrow', sans-serif; font-size: 24px; font-weight: 600; color: #141111">6</button><button type="button" style="height: 50px; border: none; border-radius: 14px; background: #FFF4C2; font-family: Oswald, 'Arial Narrow', sans-serif; font-size: 24px; font-weight: 600; color: #141111">7</button><button type="button" style="height: 50px; border: none; border-radius: 14px; background: #FFF4C2; font-family: Oswald, 'Arial Narrow', sans-serif; font-size: 24px; font-weight: 600; color: #141111">8</button><button type="button" style="height: 50px; border: none; border-radius: 14px; background: #FFF4C2; font-family: Oswald, 'Arial Narrow', sans-serif; font-size: 24px; font-weight: 600; color: #141111">9</button>
<button type="button" style="height: 50px; border: none; border-radius: 14px; background: transparent; font-family: inherit; font-size: 14px; font-weight: 700; color: #333438">Batal</button>
<button type="button" style="height: 50px; border: none; border-radius: 14px; background: #FFF4C2; font-family: Oswald, 'Arial Narrow', sans-serif; font-size: 24px; font-weight: 600; color: #141111">0</button>
<button type="button" aria-label="Hapus angka" style="height: 50px; border: none; border-radius: 14px; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#141111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 5H8l-6 7 6 7h13z"></path><path d="M17 9l-6 6"></path><path d="M11 9l6 6"></path></svg></button>
</div>
<div style="font-size: 12px; color: #5A5B5E; text-align: center">Digit keempat langsung menyimpan absen</div>
</div>
</div>
</body>
</html>
