<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HP Toko – Pop-up belum absen pulang kemarin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&amp;family=Poppins:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
@keyframes jatuh{0%{transform:translateY(-40px) rotate(0deg);opacity:0}10%{opacity:1}100%{transform:translateY(860px) rotate(540deg);opacity:1}}
@keyframes sinar{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes muncul{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
<style>body{background:#E8E6E0;display:flex;justify-content:center;padding:24px 0}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 22px; background: radial-gradient(circle at 50% 30%, #3CC47A 0%, #1F8A4C 55%, #146B39 100%); font-family: Poppins, 'Segoe UI', sans-serif; color: #141111; display: flex; flex-direction: column; justify-content: center; position: relative; overflow: hidden">

<div style="position: relative; background: #FFFFFF; border-radius: 30px; padding: 30px 20px 20px; display: flex; flex-direction: column; gap: 16px; align-items: center; text-align: center">
<div style="position: relative; width: 112px; height: 112px; display: flex; align-items: center; justify-content: center"><div style="position: relative; width: 112px; height: 112px; border-radius: 50%; background: #1F8A4C; display: flex; align-items: center; justify-content: center; animation: muncul .8s ease-out both;"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 10v11"></path><path d="M15 5.9L14 10h5.8a2 2 0 0 1 2 2.3l-1.4 7a2 2 0 0 1-2 1.7H7V10l4.3-7.6A1.9 1.9 0 0 1 15 5.9z"></path><path d="M3 10h4v11H3z"></path></svg></div></div>
<div style="font-family: Oswald, 'Arial Narrow', sans-serif; font-size: 40px; font-weight: 700; line-height: 1.1; color: #1F8A4C">Selamat bekerja, Budi!</div>
<div style="padding: 6px 14px; border-radius: 999px; border: 2px solid #1F8A4C; background: #E3F4EA; color: #15643A; font-size: 14px; font-weight: 800">Masuk 07:45 (Shift 1)</div>
<div style="width: 100%; box-sizing: border-box; background: #FDE8E8; border: 3px solid #B91C1C; border-radius: 18px; padding: 16px; display: flex; gap: 12px; align-items: flex-start; text-align: left">
<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#B91C1C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg>
<div style="display: flex; flex-direction: column; gap: 4px"><div style="font-size: 17px; font-weight: 800; color: #B91C1C">Anda belum absen pulang kemarin</div><div style="font-size: 14px; font-weight: 600; color: #141111; line-height: 1.4">Senin, 28 Sep. Hubungi admin.</div></div>
</div>

<div style="font-size: 13px; color: #5A5B5E">Menutup otomatis dalam 4 detik</div>
</div>
</div>
</body>
</html>
