<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HP Pribadi – Ajukan Tukar Shift</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&amp;family=Poppins:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
</style>
<style>body{background:#E8E6E0;display:flex;justify-content:center;padding:24px 0}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px 18px; background: #FFD62E; font-family: Poppins, 'Segoe UI', sans-serif; color: #141111; display: flex; flex-direction: column; gap: 12px">
<img src="../assets/logo.png" alt="Kubah Emas Indonesia" style="height: 36px; width: auto; align-self: flex-start">
<div style="display: flex; gap: 12px; align-items: stretch"><div style="width: 6px; background: #141111"></div><div style="font-family: Oswald, 'Arial Narrow', sans-serif; font-size: 28px; font-weight: 700; line-height: 1.1">Ajukan tukar shift</div></div>
<div style="background: #FFFFFF; border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; gap: 4px; padding: 4px; background: #F2EFE6; border-radius: 14px"><button type="button" style="flex: 1; height: 42px; border: none; border-radius: 10px; background: #141111; color: #FFD62E; font-family: inherit; font-size: 14px; font-weight: 800">Tukar dengan rekan</button><button type="button" style="flex: 1; height: 42px; border: none; border-radius: 10px; background: transparent; color: #141111; font-family: inherit; font-size: 14px; font-weight: 800">Pindah shift</button></div>
<div style="font-size: 13px; font-weight: 800">Tanggal</div><input aria-label="Tanggal" value="Selasa, 6 Okt 2026" style="height: 48px; border: 2px solid #333438; border-radius: 12px; background: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 700; color: #141111; padding: 0 10px; box-sizing: border-box; width: 100%">
<div style="font-size: 13px; font-weight: 800">Tukar dengan</div><select aria-label="Rekan" style="height: 48px; border: 2px solid #333438; border-radius: 12px; background: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 700; color: #141111; padding: 0 10px; box-sizing: border-box; width: 100%"><option>Ari (Shift 1)</option></select>
<div style="font-size: 13px; font-weight: 800">Alasan (opsional)</div><input aria-label="Alasan" value="Antar ibu ke dokter pagi" style="height: 48px; border: 2px solid #333438; border-radius: 12px; background: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 700; color: #141111; padding: 0 10px; box-sizing: border-box; width: 100%">
<div style="background: #E3F4EA; border-radius: 12px; padding: 12px; font-size: 14px; font-weight: 700">6 Okt: Anda → <b>Shift 1</b>, Ari → <b>Shift 2</b></div>
</div>
<div style="font-size: 12px; font-weight: 600">Sepakati dulu dengan rekan. Rekan setuju di aplikasinya, lalu ACC admin.</div>
<div style="flex-grow: 1"></div>
<div style="display: flex; gap: 10px; flex-shrink: 0"><button type="button" aria-label="Kembali" style="width: 56px; flex-shrink: 0; border: 3px solid #141111; border-radius: 18px; background: transparent; font-family: inherit; font-size: 26px; font-weight: 800; color: #141111">‹</button><button type="button" style="flex-grow: 1; height: 54px; border: 4px solid #5CC98A; border-radius: 18px; background: #1F8A4C; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 800">Kirim</button></div>
</div>
</body>
</html>
