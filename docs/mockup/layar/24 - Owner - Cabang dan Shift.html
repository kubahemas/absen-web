x; font-weight: 700; color: #141111; padding: 0 10px; box-sizing: border-box; width: 100%"></div><div style="display: flex; flex-direction: column; gap: 4px"><div style="font-size: 12px; font-weight: 800">Toko tutup</div><input aria-label="Toko tutup" value="20:00" style="height: 46px; border: 2px solid #333438; border-radius: 12px; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; color: #141111; padding: 0 10px; box-sizing: border-box; width: 100%"></div><div style="display: flex; flex-direction: column; gap: 4px"><div style="font-size: 12px; font-weight: 800">Pulang</div><input aria-label="Pulang" value="20:30" style="height: 46px; border: 2px solid #333438; border-radius: 12px; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; color: #141111; padding: 0 10px; box-sizing: border-box; width: 100%"></div><div style="display: flex; flex-direction: column; gap: 4px"><div style="font-size: 12px; font-weight: 800">Toleransi pulang</div><input aria-label="Toleransi pulang" value="5 menit" style="height: 46px; border: 2px solid #333438; border-radius: 12px; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; color: #141111; padding: 0 10px; box-sizing: border-box; width: 100%"></div></div></div><button type="button" style="min-height: 52px; border: 2px dashed #141111; border-radius: 16px; background: transparent; font-family: inherit; font-size: 15px; font-weight: 800; color: #141111">+ Tambah shift</button><button type="button" style="min-height: 48px; border: none; background: transparent; font-family: inherit; font-size: 14px; font-weight: 800; color: #141111; text-decoration: underline">+ Tambah cabang baru</button><div style="font-size: 12px; font-weight: 600">Perubahan jam berlaku mulai besok.</div></div>
<div style="display: flex; gap: 10px; flex-shrink: 0"><button type="button" aria-label="Kembali" style="width: 56px; flex-shrink: 0; border: 3px solid #141111; border-radius: 18px; background: transparent; font-family: inherit; font-size: 26px; font-weight: 800; color: #141111">‹</button><button type="button" style="flex-grow: 1; height: 54px; border: 4px solid #5CC98A; border-radius: 18px; background: #1F8A4C; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 800">Simpan</button></div></div>
