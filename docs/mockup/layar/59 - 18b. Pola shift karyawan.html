<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin – Pola Shift Karyawan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&amp;family=Poppins:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
</style>
<style>body{background:#E8E6E0;display:flex;justify-content:center;padding:24px 0}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px 18px; background: #FFD62E; font-family: Poppins, 'Segoe UI', sans-serif; color: #141111; display: flex; flex-direction: column; gap: 12px">
<div style="flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: center"><img src="../assets/logo.png" alt="Kubah Emas Indonesia" style="height: 36px; width: auto"><div style="padding: 6px 12px; border-radius: 999px; background: #333438; color: #FFD62E; font-size: 12px; font-weight: 800">Admin Ngawi</div></div>
<div style="display: flex; gap: 12px; align-items: stretch"><div style="width: 6px; background: #141111"></div><div style="display: flex; flex-direction: column; gap: 2px"><div style="font-family: Oswald, 'Arial Narrow', sans-serif; font-size: 28px; font-weight: 700; line-height: 1.1">Pola shift</div><div style="font-size: 13px; font-weight: 600">Budi Santoso · K003</div></div></div>
<div style="background: #FFFFFF; border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; gap: 4px; padding: 4px; background: #F2EFE6; border-radius: 14px"><button type="button" style="flex: 1; height: 42px; border: none; border-radius: 10px; background: transparent; color: #141111; font-family: inherit; font-size: 14px; font-weight: 800">Tetap</button><button type="button" style="flex: 1; height: 42px; border: none; border-radius: 10px; background: #141111; color: #FFD62E; font-family: inherit; font-size: 14px; font-weight: 800">Bergilir</button></div>
<div style="font-size: 13px; font-weight: 800">Urutan shift</div>
<div style="display: flex; align-items: center; gap: 8px"><select aria-label="Shift pertama" style="height: 46px; border: 2px solid #333438; border-radius: 12px; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; color: #141111; padding: 0 10px; box-sizing: border-box; width: 100%"><option>Shift 1</option></select><span style="font-weight: 800">→</span><select aria-label="Shift kedua" style="height: 46px; border: 2px solid #333438; border-radius: 12px; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; color: #141111; padding: 0 10px; box-sizing: border-box; width: 100%"><option>Shift 2</option></select></div>
<div style="font-size: 13px; font-weight: 800">Ganti setiap</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px"><button type="button" style="min-height: 44px; border: none; border-radius: 12px; background: #141111; color: #FFD62E; font-family: inherit; font-size: 13px; font-weight: 800">1 minggu</button><button type="button" style="min-height: 44px; border: 2px solid #333438; border-radius: 12px; background: #FFFFFF; color: #141111; font-family: inherit; font-size: 13px; font-weight: 800">2 minggu</button><button type="button" style="min-height: 44px; border: 2px solid #333438; border-radius: 12px; background: #FFFFFF; color: #141111; font-family: inherit; font-size: 13px; font-weight: 800">1 bulan</button><button type="button" style="min-height: 44px; border: 2px solid #333438; border-radius: 12px; background: #FFFFFF; color: #141111; font-family: inherit; font-size: 13px; font-weight: 800">3 bulan</button></div>
<div style="font-size: 13px; font-weight: 800">Mulai</div>
<input aria-label="Tanggal mulai pola" value="Senin, 5 Okt 2026" style="height: 46px; border: 2px solid #333438; border-radius: 12px; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; color: #141111; padding: 0 10px; box-sizing: border-box; width: 100%">
</div>
<div style="background: #FFFFFF; border-radius: 20px; padding: 10px 14px; display: flex; flex-direction: column">
<div style="font-size: 13px; font-weight: 800; padding: 4px 0">Pratinjau</div><div style="display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #EEEAE0; font-size: 14px"><span style="font-weight: 600">5–10 Okt</span><span style="font-weight: 800">Shift 1</span></div><div style="display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #EEEAE0; font-size: 14px"><span style="font-weight: 600">12–17 Okt</span><span style="font-weight: 800">Shift 2</span></div><div style="display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #EEEAE0; font-size: 14px"><span style="font-weight: 600">19–24 Okt</span><span style="font-weight: 800">Shift 1</span></div><div style="display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #EEEAE0; font-size: 14px"><span style="font-weight: 600">26–31 Okt</span><span style="font-weight: 800">Shift 2</span></div>
</div>
</div>
<div style="display: flex; gap: 10px; flex-shrink: 0"><button type="button" aria-label="Kembali" style="width: 56px; flex-shrink: 0; border: 3px solid #141111; border-radius: 18px; background: transparent; font-family: inherit; font-size: 26px; font-weight: 800; color: #141111">‹</button><button type="button" style="flex-grow: 1; height: 54px; border: 4px solid #5CC98A; border-radius: 18px; background: #1F8A4C; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 800">Simpan</button></div>
</div>
</body>
</html>
