<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HP Pribadi – Form Izin dan Cuti</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&amp;family=Poppins:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
</style>
<style>body{background:#E8E6E0;display:flex;justify-content:center;padding:24px 0}</style>
</head>
<body>
<div style="width: 390px; height: 940px; box-sizing: border-box; padding: 24px 22px 30px; background: #FFD62E; font-family: Poppins, 'Segoe UI', sans-serif; color: #141111; display: flex; flex-direction: column; gap: 16px">
<img src="../assets/logo.png" alt="Kubah Emas Indonesia" style="height: 44px; width: auto; align-self: flex-start">
<div style="display: flex; gap: 12px; align-items: stretch">
<div style="width: 6px; background: #141111"></div>
<div style="font-family: Oswald, 'Arial Narrow', sans-serif; font-size: 30px; font-weight: 700">Ajukan izin / cuti</div>
</div>
<div style="background: #FFFFFF; border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="jenis" style="font-size: 13px; font-weight: 700">Jenis izin</label>
<select id="jenis" style="height: 52px; border: 2px solid #333438; border-radius: 14px; background: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 700; color: #141111; padding: 0 12px">
<option>Menikah</option>
<option>Sakit</option>
<option>Keperluan pribadi</option>
<option>Keluarga meninggal</option>
<option>Istri melahirkan</option>
<option>Cuti</option>
</select>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="mulai" style="font-size: 13px; font-weight: 700">Mulai</label>
<input id="mulai" value="Sen, 5 Okt 2026" style="height: 52px; border: 2px solid #333438; border-radius: 14px; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; color: #141111; padding: 0 10px; box-sizing: border-box; width: 100%">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="selesai" style="font-size: 13px; font-weight: 700">Selesai</label>
<input id="selesai" value="Jum, 9 Okt 2026" style="height: 52px; border: 2px solid #333438; border-radius: 14px; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; color: #141111; padding: 0 10px; box-sizing: border-box; width: 100%">
</div>
</div>
<div style="font-size: 14px; font-weight: 700">5 hari kerja. Menikah maksimal 3 hari.</div>
<div style="font-size: 13px; font-weight: 700">Kelebihan 2 hari diambil dari</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button type="button" style="min-height: 64px; border: none; border-radius: 16px; background: #333438; font-family: inherit; color: #FFD62E; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
<div style="font-size: 16px; font-weight: 800">Cuti</div>
<div style="font-size: 12px; font-weight: 600; color: #FFFFFF">sisa 4 hari</div>
</button>
<button type="button" style="min-height: 64px; border: 2px solid #333438; border-radius: 16px; background: #FFFFFF; font-family: inherit; color: #141111; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
<div style="font-size: 16px; font-weight: 800">Izin biasa</div>
<div style="font-size: 12px; font-weight: 600; color: #5A5B5E">memengaruhi performa</div>
</button>
</div>
<div style="background: #FFF4C2; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 4px">
<div style="font-size: 13px; font-weight: 800">Hasil pengajuan</div>
<div style="font-size: 14px; font-weight: 700">3 hari izin khusus menikah (5–7 Okt)</div>
<div style="font-size: 14px; font-weight: 700">2 hari cuti (8–9 Okt)</div>
<div style="font-size: 13px; color: #3E3F42">Sisa cuti setelah ini 2 hari. Tidak memengaruhi performa.</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="ket" style="font-size: 13px; font-weight: 700">Keterangan (opsional)</label>
<textarea id="ket" style="height: 64px; border: 2px solid #333438; border-radius: 14px; background: #FFFFFF; font-family: inherit; font-size: 14px; color: #141111; padding: 10px; box-sizing: border-box; resize: none">Pernikahan di Madiun</textarea>
</div>
</div>
<div style="flex-grow: 1"></div>
<button type="button" style="height: 72px; border: 4px solid #5CC98A; border-radius: 26px; background: #1F8A4C; color: #FFFFFF; font-family: inherit; font-size: 22px; font-weight: 800">Kirim pengajuan</button>
</div>
</body>
</html>
