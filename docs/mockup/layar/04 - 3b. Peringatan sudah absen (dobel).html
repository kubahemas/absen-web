<div style="font-family: Oswald, 'Arial Narrow', sans-serif; font-size: 34px; font-weight: 700; line-height: 1.15">Budi Santoso sudah absen masuk jam 07:40</div>
<div style="font-size: 16px; font-weight: 700">Apakah itu Anda?</div>

<div style="font-size: 12px; font-weight: 600; text-align: center; line-height: 1.45">YA: tidak ada data baru. BUKAN SAYA: absen Anda sekarang tetap direkam, dan kedua foto dikirim ke admin untuk dicek.</div>
