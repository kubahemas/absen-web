<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HP Toko – Lembur</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&amp;family=Poppins:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
</style>
<style>body{background:#E8E6E0;display:flex;justify-content:center;padding:24px 0}</style>
</head>
<body>
<div style="width: 390px; height: 940px; box-sizing: border-box; padding: 24px 22px 28px; background: #FFD62E; font-family: Poppins, 'Segoe UI', sans-serif; color: #141111; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; justify-content: space-between; align-items: center">
<img src="../assets/logo.png" alt="Kubah Emas Indonesia" style="height: 44px; width: auto">
<div style="font-family: Oswald, 'Arial Narrow', sans-serif; font-size: 22px; font-weight: 700">LEMBUR</div>
</div>
<div style="background: #333438; color: #FFFFFF; border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 10px">
<div style="font-family: Oswald, 'Arial Narrow', sans-serif; font-size: 28px; font-weight: 700; color: #FFD62E">Budi Santoso</div>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<div style="padding: 6px 12px; border-radius: 999px; background: #FFFFFF; color: #141111; font-size: 13px; font-weight: 700">Pulang 17:48</div>
<div style="padding: 6px 12px; border-radius: 999px; background: #FFD62E; color: #141111; font-size: 13px; font-weight: 700">Lembur 1–2 jam</div>
</div>
</div>
<div style="display: flex; gap: 12px; align-items: stretch">
<div style="width: 6px; background: #141111"></div>
<div style="font-size: 20px; font-weight: 800">Pekerjaan apa?</div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button type="button" style="min-height: 80px; border: none; border-radius: 18px; background: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 700; color: #141111">Stok opname</button><button type="button" style="min-height: 80px; border: none; border-radius: 18px; background: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 700; color: #141111">Bongkar muat</button><button type="button" style="min-height: 80px; border: none; border-radius: 18px; background: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 700; color: #141111">Penataan barang</button><button type="button" style="min-height: 80px; border: none; border-radius: 18px; background: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 700; color: #141111">Melayani pelanggan</button><button type="button" style="min-height: 80px; border: none; border-radius: 18px; background: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 700; color: #141111">Selesaikan tugas luar</button><button type="button" style="min-height: 80px; border: none; border-radius: 18px; background: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 700; color: #141111">Lainnya</button>
</div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="ket" style="font-size: 13px; font-weight: 700">Keterangan (opsional, wajib jika pilih Lainnya)</label><textarea id="ket" style="height: 64px; border: 2px solid #333438; border-radius: 14px; background: #FFFFFF; font-family: inherit; font-size: 14px; color: #141111; padding: 10px; box-sizing: border-box; resize: none">Stok opname rak aksesoris dan gudang belakang</textarea></div><div style="flex-grow: 1"></div><button type="button" style="height: 70px; border: none; border-radius: 26px; background: #141111; color: #FFFFFF; font-family: Oswald, 'Arial Narrow', sans-serif; font-size: 26px; font-weight: 700">SIMPAN LEMBUR</button><div style="font-size: 13px; font-weight: 600; text-align: center">Lembur menunggu persetujuan admin.</div>
</div>
</body>
</html>
